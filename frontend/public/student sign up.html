<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up - BUCMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6c757d;
            --accent-color: #ff6b6b;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        header {
            background-color: white;
            box-shadow: var(--shadow);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        
        .logo span {
            color: var(--accent-color);
        }
        
        .logo-icon {
            margin-right: 10px;
            font-size: 1.8rem;
        }
        
        .auth-container {
            display: flex;
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 50px;
        }
        
        .auth-box {
            background-color: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            margin: auto;
            display: flex;
        }
        
        .auth-image {
            flex: 1;
            background: linear-gradient(135deg, #4a6fa5 0%, #7a9ac0 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        
        .auth-image h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: white;
        }
        
        .auth-image p {
            margin-bottom: 2rem;
        }
        
        .auth-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
        }
        
        .auth-forms {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            max-height: 80vh;
        }
        
        .form-heading {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e1e1e1;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #e1e1e1;
            border-radius: 4px;
            font-size: 1rem;
            transition: var(--transition);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(74, 111, 165, 0.2);
        }
        
        .btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
        }
        
        .btn:hover {
            background-color: #3d5d8a;
        }
        
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }
        
        .link {
            color: var(--secondary-color);
            text-decoration: none;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        
        .link:hover {
            color: var(--primary-color);
        }
        
        .link i {
            margin-right: 5px;
        }
        
        .alert {
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .alert-danger {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
            border: 1px solid rgba(220, 53, 69, 0.2);
        }
        
        .alert-success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(40, 167, 69, 0.2);
        }
        
        @media (max-width: 768px) {
            .auth-box {
                flex-direction: column;
            }
            
            .auth-image {
                padding: 30px;
            }
            
            .auth-forms {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="home.html" class="logo">
                    <i class="fas fa-comment-dots logo-icon"></i>
                    BUCMS
                </a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="container">
            <div class="auth-box">
                <div class="auth-image">
                    <div class="auth-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2>Join Student Portal</h2>
                    <p>Create your account to access our emotional intelligence platform and get your concerns resolved quickly.</p>
                </div>
                <div class="auth-forms">
                    <h2 class="form-heading">Sign Up</h2>
                    
                    <form action="s dashboard.html" method="post" id="signupForm">
                        <div class="form-group">
                            <label for="signup-name">Full Name</label>
                            <input type="text" id="signup-name" name="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <input type="email" id="signup-email" name="email" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-student-id">Student ID</label>
                            <input type="text" id="signup-student-id" name="student_id" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-program">Program/Course</label>
                            <input type="text" id="signup-program" name="program" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-year">Year of Study</label>
                            <select id="signup-year" name="year" class="form-control" required>
                                <option value="">Select Year</option>
                                <option value="1">100L</option>
                                <option value="2">200L</option>
                                <option value="3">300L</option>
                                <option value="4">400L</option>
                                <option value="5">500L or Above</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <input type="password" id="signup-password" name="password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-confirm-password">Confirm Password</label>
                            <input type="password" id="signup-confirm-password" name="confirm_password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <button type="submit" name="signup" class="btn">Sign Up</button>
                        </div>
                        
                        <div class="links">
                            <a href="student login.html" class="link">Already have an account? <strong>Login</strong></a>
                        </div>
                    </form>
                    
                    <div class="links" style="margin-top: 2rem;">
                        <a href="home.html" class="link">
                            <i class="fas fa-arrow-left"></i> Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('signupForm');
            
            form.addEventListener('submit', function(event) {
                const password = document.getElementById('signup-password').value;
                const confirmPassword = document.getElementById('signup-confirm-password').value;
                
                // Simple validation for password matching
                if (password !== confirmPassword) {
                    event.preventDefault();
                    alert('Passwords do not match. Please try again.');
                    return false;
                }
                
                // You can add more validations here if needed
                
                // If everything is valid, the form will submit normally
                return true;
            });
        });
    </script>
</body>
</html>
