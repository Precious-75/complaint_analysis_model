<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Login - BUCMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #343a40;
            line-height: 1.6;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        header {
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a6fa5;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        
        .logo-icon {
            margin-right: 10px;
            font-size: 1.8rem;
        }
        
        .auth-container {
            display: flex;
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 50px;
        }
        
        .auth-box {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            margin: auto;
            display: flex;
        }
        
        .auth-image {
            flex: 1;
            background: linear-gradient(135deg, #2c3e50 0%, #4a6fa5 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        
        .auth-image h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: white;
        }
        
        .auth-image p {
            margin-bottom: 2rem;
        }
        
        .auth-icon {
            font-size: 5rem;
            margin-bottom: 2rem;
        }
        
        .auth-forms {
            flex: 1;
            padding: 40px;
        }
        
        .form-heading {
            font-size: 1.8rem;
            color: #343a40;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e1e1e1;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #e1e1e1;
            border-radius: 4px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #343a40;
            box-shadow: 0 0 0 2px rgba(52, 58, 64, 0.2);
        }
        
        .btn {
            padding: 10px 20px;
            background-color: #343a40;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn:hover {
            background-color: #23272b;
        }
        
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
        }
        
        .link {
            color: #6c757d;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .link:hover {
            color: #343a40;
        }
        
        .link i {
            margin-right: 5px;
        }
        
        @media (max-width: 768px) {
            .auth-box {
                flex-direction: column;
            }
            
            .auth-image {
                padding: 30px;
            }
            
            .auth-forms {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="home.html" class="logo">
                    <i class="fas fa-comment-dots logo-icon"></i>
                    BUCMS
                </a>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="container">
            <div class="auth-box">
                <div class="auth-image">
                    <div class="auth-icon">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <h2>Worker Portal</h2>
                    <p>Access the system to resolve and respond to complaints from students efficiently.</p>
                </div>
                <div class="auth-forms">
                    <h2 class="form-heading">Worker Login</h2>
                    
                    <form action="w dashboard.html" method="post">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" name="email" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" name="password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <button type="submit" name="login" class="btn">Login</button>
                        </div>
                        
                        <div class="links">
                            <a href="#" class="link">Forgot password?</a>
                            <a href="worker sign up.html" class="link">Don't have an account? <strong>Sign Up</strong></a>
                        </div>
                    </form>
                    
                    <div class="links" style="margin-top: 2rem;">
                        <a href="home.html" class="link">
                            <i class="fas fa-arrow-left"></i> Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
