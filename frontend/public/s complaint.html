<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint - BUCMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6c757d;
            --accent-color: #ff6b6b;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background-color: white;
            box-shadow: var(--shadow);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo span {
            color: var(--accent-color);
        }

        .logo-icon {
            margin-right: 10px;
            font-size: 1.8rem;
        }

        .user-info {
            display: flex;
            align-items: center;
        }

        .user-info span {
            margin-right: 10px;
            font-weight: 600;
        }

        .logout-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            background-color: #c82333;
        }

        .complaint-form {
            padding-top: 100px;
            padding-bottom: 50px;
        }

        .form-container {
            background-color: white;
            box-shadow: var(--shadow);
            border-radius: 10px;
            padding: 30px;
        }

        .form-title {
            margin-bottom: 25px;
            color: var(--primary-color);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23343a40' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--light-color);
            color: var(--secondary-color);
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px dashed #ddd;
        }

        .file-upload-label:hover {
            background-color: #e9ecef;
        }

        .file-upload-label i {
            margin-right: 8px;
        }

        .file-upload input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-info {
            margin-top: 8px;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .form-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #3a5a84;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        @media (max-width: 768px) {
            .form-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <i class="fas fa-comment-dots logo-icon"></i>
                    BUCMS
                </a>
                <div class="user-info">
                    <button class="logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <div class="complaint-form container">
        <div class="form-container">
            <h2 class="form-title">Submit a New Complaint</h2>
            <form id="studentComplaintForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="matricNumber">Matric Number</label>
                    <input type="text" id="matricNumber" name="matricNumber" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="schoolEmail">School Email</label>
                    <input type="email" id="schoolEmail" name="schoolEmail" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="complaintTitle">Title of Complaint</label>
                    <input type="text" id="complaintTitle" name="complaintTitle" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="complaintCategory">Category</label>
                    <select id="complaintCategory" name="complaintCategory" class="form-control" required>
                        <option value="">Select a category</option>
                        <option value="academic">Academic</option>
                        <option value="nonAcademic">Non-Academic</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="complaintDate">Date of Incident</label>
                    <input type="date" id="complaintDate" name="complaintDate" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="complaintMessage">Complaint Message</label>
                    <textarea id="complaintMessage" name="complaintMessage" class="form-control" required></textarea>
                </div>

                <div class="form-group">
                    <label>Supporting Documents</label>
                    <div class="file-upload">
                        <label for="supportingDocs" class="file-upload-label">
                            <i class="fas fa-cloud-upload-alt"></i> Upload Files
                        </label>
                        <input type="file" id="supportingDocs" name="supportingDocs" multiple>
                    </div>
                    <div id="fileInfo" class="file-info">Supported formats: Images, PDF (Max size: 5MB)</div>
                    <div id="fileList" class="file-info"></div>
                </div>

                <div class="form-buttons">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Complaint</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Logout button functionality
            const logoutBtn = document.querySelector('.logout-btn');
            logoutBtn.addEventListener('click', function() {
                alert('Logged out successfully!');
                window.location.href = 'index.html';
            });

            // Cancel button functionality
            const cancelBtn = document.getElementById('cancelBtn');
            cancelBtn.addEventListener('click', function() {
                window.location.href = 's dashboard.html';
            });

            // File upload handling
            const fileInput = document.getElementById('supportingDocs');
            const fileList = document.getElementById('fileList');

            fileInput.addEventListener('change', function() {
                fileList.innerHTML = '';
                
                if (this.files.length > 0) {
                    const fileListHeader = document.createElement('p');
                    fileListHeader.textContent = 'Selected files:';
                    fileList.appendChild(fileListHeader);
                    
                    for (let i = 0; i < this.files.length; i++) {
                        const file = this.files[i];
                        const fileSize = (file.size / 1024 / 1024).toFixed(2);
                        
                        const fileItem = document.createElement('div');
                        fileItem.textContent = `${file.name} (${fileSize}MB)`;
                        fileList.appendChild(fileItem);
                        
                        if (fileSize > 5) {
                            const warningItem = document.createElement('div');
                            warningItem.textContent = `Warning: ${file.name} exceeds the 5MB limit`;
                            warningItem.style.color = 'var(--danger-color)';
                            fileList.appendChild(warningItem);
                        }
                    }
                }
            });

            // Form submission
            const form = document.getElementById('studentComplaintForm');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Here you would normally send the form data to your server
                // For demonstration purposes, we'll just show an alert
                alert('Complaint submitted successfully!');
                window.location.href = 's dashboard.html';
            });
        });
    </script>
</body>
</html>
